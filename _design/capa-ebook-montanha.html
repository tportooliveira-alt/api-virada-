<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1600px;height:2560px;overflow:hidden;}
  body{
    background:url("capa-limpa.jpg") center/1600px 2560px no-repeat #0b1220;
    font-family:'Onest',sans-serif;
    position:relative;
  }

  /* A faixa de selos original dizia "MÉTODO 50-30-20 · 8 CAPÍTULOS · +4 BÔNUS".
     O e-book tem 5 capítulos, são 3 bônus e o produto não usa 50-30-20.
     Cobrimos só essa faixa — a arte fica intacta. */

  /* O subtítulo original era "O guia estratégico para a prosperidade financeira
     sustentável" — linguagem de consultoria, o oposto do tom da landing.
     A faixa borra e escurece o próprio céu da foto, em vez de tapar com um
     retângulo chapado: some com o texto e continua parecendo a mesma imagem. */
  .promessa{
    position:absolute;left:0;right:0;top:842px;height:256px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-align:center;
  }
  .promessa span{
    font-size:44px;line-height:1.3;color:#F8FAFC;font-weight:400;
    text-shadow:0 2px 16px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9);
  }
  .promessa span.forte{font-weight:600;color:#fff;}

  .tampa{
    position:absolute;left:0;right:0;top:1818px;height:150px;
    background:linear-gradient(180deg,
      rgba(9,13,20,0) 0%,
      rgba(9,13,20,.72) 12%,
      rgba(9,13,20,1) 26%,
      rgba(9,13,20,1) 74%,
      rgba(9,13,20,.72) 88%,
      rgba(9,13,20,0) 100%);
  }

  .selos{
    position:absolute;left:0;right:0;top:1818px;height:150px;
    display:flex;align-items:center;justify-content:center;gap:0;
  }
  .selo{
    font-size:31px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:#F1F5F9;
    padding:0 44px;position:relative;white-space:nowrap;
    text-shadow:0 2px 10px rgba(0,0,0,.75);
  }
  .selo b{font-weight:700;color:#E8C06A;}
  .selo + .selo::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:7px;height:7px;border-radius:50%;
    background:rgba(232,192,106,.8);
  }
</style>
</head>
<body>
  <div class="promessa">
    <span>Você sabe quanto ganha.</span>
    <span class="forte">Não sabe pra onde foi.</span>
  </div>

  <div class="tampa"></div>
  <div class="selos">
    <span class="selo"><b>5</b> capítulos</span>
    <span class="selo"><b>3</b> bônus</span>
    <span class="selo">app incluso</span>
  </div>
</body>
</html>
