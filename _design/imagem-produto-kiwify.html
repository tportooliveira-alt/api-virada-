<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Onest:wght@400;500;600&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:1000px;overflow:hidden;}
  body{
    background:#0F172A;
    font-family:'Onest',sans-serif;color:#fff;position:relative;
  }
  .brilho{
    position:absolute;right:-180px;bottom:-260px;
    width:1000px;height:900px;border-radius:50%;
    background:radial-gradient(circle, rgba(34,197,94,.20) 0%, rgba(245,197,66,.10) 45%, transparent 70%);
  }
  .grade{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:linear-gradient(160deg, rgba(0,0,0,.85), transparent 60%);
    mask-image:linear-gradient(160deg, rgba(0,0,0,.85), transparent 60%);
  }

  .palco{
    position:relative;height:100%;
    display:grid;grid-template-columns:1fr 400px;align-items:center;
    padding:64px 34px 64px 70px;gap:28px;
  }

  .marca{
    display:flex;align-items:center;gap:14px;margin-bottom:28px;
  }
  .marca .bolha{
    width:44px;height:44px;border-radius:12px;
    background:#22C55E;display:grid;place-items:center;
    font-family:'Figtree',sans-serif;font-weight:900;font-size:22px;color:#052E16;
  }
  .marca span{
    font-family:'Figtree',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.01em;
  }

  h1{
    font-family:'Figtree',sans-serif;font-weight:900;
    font-size:56px;line-height:1.05;letter-spacing:-.042em;
  }
  h1 .marcatexto{
    display:inline-block;background:#F5C542;color:#0F172A;
    padding:0 .1em .05em;border-radius:8px;transform:rotate(-1.2deg);
  }

  .sub{
    margin-top:24px;font-size:23px;line-height:1.5;color:#CBD5E1;max-width:20ch;
  }

  .selos{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px;}
  .selo{
    font-family:'Figtree',sans-serif;font-size:18px;font-weight:800;
    letter-spacing:.03em;
    border:2px solid rgba(255,255,255,.18);border-radius:999px;
    padding:10px 18px;color:#E2E8F0;
  }
  .selo.destaque{background:#22C55E;border-color:#22C55E;color:#052E16;}

  .aparelho{
    position:relative;height:100%;display:flex;align-items:center;justify-content:flex-end;
  }
  .aparelho img{
    height:95%;width:auto;
    transform:rotate(-3deg);
    filter:drop-shadow(0 40px 70px rgba(0,0,0,.55));
    -webkit-mask-image:radial-gradient(ellipse 74% 92% at 50% 50%, #000 78%, transparent 100%);
    mask-image:radial-gradient(ellipse 74% 92% at 50% 50%, #000 78%, transparent 100%);
  }
</style>
</head>
<body>
  <div class="brilho"></div>
  <div class="grade"></div>

  <div class="palco">
    <div>
      <div class="marca">
        <span class="bolha">V</span>
        <span>Código da Virada</span>
      </div>

      <h1>Você sabe<br>quanto ganha.<br>Não sabe<br><span class="marcatexto">pra onde foi</span>.</h1>

      <p class="sub">O app que lança seu gasto em 10 segundos e monta a planilha sozinho.</p>

      <div class="selos">
        <span class="selo destaque">Pagamento único</span>
        <span class="selo">App + e-book + 3 bônus</span>
      </div>
    </div>

    <div class="aparelho"><img src="celular.png" alt=""></div>
  </div>
</body>
</html>
