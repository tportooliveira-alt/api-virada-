<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--bg-page)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:70px;border-radius:var(--radius-md);padding:10px;border:1px solid var(--border-default);display:flex;flex-direction:column;gap:38px}.sw b{font-size:11px;font-weight:600}.sw span{font-size:10px;color:inherit;opacity:.8;font-family:var(--font-mono)}.lab{font-size:11px;color:var(--text-muted);margin:0 0 8px}</style></head><body><script src="https://unpkg.com/lucide@latest"></script><div id="i" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;font-size:11px;color:var(--text-secondary)"></div><script>const m=[["gauge","Início"],["pen-line","Lançar"],["table","Relatórios"],["settings","Conta"],["shopping-cart","Mercado"],["zap","Energia"],["car","Transporte"],["home","Aluguel"],["pill","Saúde"],["utensils","Delivery"],["gamepad-2","Lazer"],["credit-card","Cartão"],["wifi","Internet"],["book-open","Educação"],["droplets","Água"],["briefcase","Salário"],["handshake","Venda"],["lightbulb","Renda extra"]];document.getElementById("i").innerHTML=m.map(([k,l])=>"<div style=\"display:flex;align-items:center;gap:8px\"><span style=\"display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--surface-muted);color:var(--text-primary)\"><i data-lucide=\""+k+"\" style=\"width:16px;height:16px\"></i></span>"+l+"</div>").join("");lucide.createIcons();</script></body></html>
