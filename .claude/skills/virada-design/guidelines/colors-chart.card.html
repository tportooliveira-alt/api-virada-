<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--bg-page)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:70px;border-radius:var(--radius-md);padding:10px;border:1px solid var(--border-default);display:flex;flex-direction:column;gap:38px}.sw b{font-size:11px;font-weight:600}.sw span{font-size:10px;color:inherit;opacity:.8;font-family:var(--font-mono)}.lab{font-size:11px;color:var(--text-muted);margin:0 0 8px}</style></head><body><div class="row"><div class="sw" style="background:var(--chart-1);color:#fff;gap:14px;min-width:50px"><b>1</b></div><div class="sw" style="background:var(--chart-2);color:#fff;gap:14px;min-width:50px"><b>2</b></div><div class="sw" style="background:var(--chart-3);color:#fff;gap:14px;min-width:50px"><b>3</b></div><div class="sw" style="background:var(--chart-4);color:#fff;gap:14px;min-width:50px"><b>4</b></div><div class="sw" style="background:var(--chart-5);color:#fff;gap:14px;min-width:50px"><b>5</b></div><div class="sw" style="background:var(--chart-6);color:#fff;gap:14px;min-width:50px"><b>6</b></div><div class="sw" style="background:var(--chart-7);color:#fff;gap:14px;min-width:50px"><b>7</b></div><div class="sw" style="background:var(--chart-8);color:#fff;gap:14px;min-width:50px"><b>8</b></div><div class="sw" style="background:var(--chart-9);color:#fff;gap:14px;min-width:50px"><b>9</b></div><div class="sw" style="background:var(--chart-10);color:#fff;gap:14px;min-width:50px"><b>10</b></div></div><p class="lab" style="margin-top:10px">Entradas --chart-income (verde) · Saídas --chart-expense (vermelho) · Saldo --chart-balance (azul).</p></body></html>
